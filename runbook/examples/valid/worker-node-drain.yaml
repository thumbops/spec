apiVersion: thumbops.mobiletechnologies.cloud/v1
kind: Runbook
metadata:
  name: worker-node-drain
  description: Svuota un nodo worker con problemi, rispettando i PodDisruptionBudget
spec:
  target:
    clusters:
      matchLabels: { env: staging }
    nodes:
      matchLabels: { node-role.kubernetes.io/worker: "" }
  action:
    type: drain
    params: { timeoutSeconds: 900 }
  approval: single
